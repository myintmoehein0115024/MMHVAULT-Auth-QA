name: N10-A7.30 locked end-to-end browser synthetic acceptance
on:
  push:
    branches: [n10-a7-3-staging-readonly-review]
    paths:
      - 'integration/N10-A7.30-browser-acceptance-LOCKED.cjs'
      - 'integration/N10-A7.29-turnstile-actions-LOCKED.cjs'
      - 'integration/N10-A7.23-real-username-acceptance-LOCKED.cjs'
      - 'integration/N10-A7.24-supabase-browser-adapter-REVIEW-LOCKED.cjs'
      - 'integration/N10-A7.27-staging-ephemeral-sdk-LOCKED.cjs'
      - 'tests/N10-A7.30-real-sdk-turnstile-browser.test.cjs'
      - '.github/workflows/n10-a730-browser-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked QA SDK and tooling
        working-directory: qa/n10-a728-real-sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify committed source gates and Node syntax
        run: |
          grep -q 'const ALLOW_REAL_OPERATIONS=false' integration/N10-A7.23-real-username-acceptance-LOCKED.cjs
          grep -q 'const STAGING_ADAPTER_ENABLED=false' integration/N10-A7.24-supabase-browser-adapter-REVIEW-LOCKED.cjs
          grep -q 'const STAGING_SDK_BOOTSTRAP_ENABLED=false' integration/N10-A7.27-staging-ephemeral-sdk-LOCKED.cjs
          grep -q 'const ALLOW_TURNSTILE_ACTIONS=false' integration/N10-A7.29-turnstile-actions-LOCKED.cjs
          grep -q 'const ALLOW_BROWSER_ACCEPTANCE=false' integration/N10-A7.30-browser-acceptance-LOCKED.cjs
          grep -q 'const ALLOW_CLOUD_WINDOW_MUTATION=false' integration/N10-A7.29-window-approval-LOCKED.cjs
          node --check integration/N10-A7.30-browser-acceptance-LOCKED.cjs
          node --check tests/N10-A7.30-real-sdk-turnstile-browser.test.cjs
      - name: Run offline-browser integrated acceptance, negative tests and seven viewport checks
        run: node --test --test-concurrency=1 tests/N10-A7.30-real-sdk-turnstile-browser.test.cjs
