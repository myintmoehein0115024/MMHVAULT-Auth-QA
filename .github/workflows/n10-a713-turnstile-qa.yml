name: N10-A7.13 Turnstile host action replay security tests
on:
  push:
    branches: [n10-a7-3-staging-readonly-review]
    paths:
      - 'tests/N10-A7.13-turnstile-validation-mock.test.cjs'
      - '.github/workflows/n10-a713-turnstile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test actual closed Staging source with mocked Siteverify
        run: node --test tests/N10-A7.13-turnstile-validation-mock.test.cjs
  fail-closed-https:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Real staging HTTPS 3 checks without user credentials
        shell: python
        run: |
          import urllib.request,urllib.error,json,sys
          base='https://ldivswlhtgmznzwhzsoi.supabase.co/functions/v1/mmh-n10a6-username'
          h={'Origin':'https://myintmoehein0115024.github.io','Content-Type':'application/json'}
          cases=[
            ('preflight',{'action':'preflight'},200,'preflight_ok'),
            ('login',{'action':'login','username':'dummy_test','password':'dummy-only'},503,'n10a6_disabled'),
            ('bind',{'action':'bind','username':'dummy_test','password':'dummy-only'},503,'n10a6_disabled')
          ]
          good=0
          for name,data,expected,code in cases:
            q=urllib.request.Request(base,data=json.dumps(data).encode(),method='POST',headers=h)
            try:
              with urllib.request.urlopen(q,timeout=15) as r:s=r.status;b=r.read(2000)
            except urllib.error.HTTPError as ex:
              s=ex.code;b=ex.read(2000)
            j=json.loads(b)
            ok=s==expected and j.get('code')==code and 'access_token' not in j and 'refresh_token' not in j
            if name=='preflight': ok=ok and j.get('enabled') is False
            print('STAGING_HTTP',name,s,code,'PASS' if ok else 'FAIL')
            good+=int(ok)
          print('N10A713_REAL_HTTP',good,'/',len(cases))
          if good!=len(cases):sys.exit(1)
