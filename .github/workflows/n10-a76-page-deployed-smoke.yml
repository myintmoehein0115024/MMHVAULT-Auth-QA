name: N10-A7.6 deployed QA page safety smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/n10-a76-page-deployed-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-page-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect live QA Pages HTML and pinned SDK - no user credentials
        shell: python
        run: |
          import urllib.request,time,re,sys
          url='https://myintmoehein0115024.github.io/MMHVAULT-Auth-QA/n10a75-real-jwt-owner-qa.html'
          last=None
          for attempt in range(8):
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MMHVAULT-N10A76-QA'}),timeout=12)
              html=r.read(100000).decode('utf-8')
              ok = (r.status==200 and 'storage:window.sessionStorage' in html
                and 'Content-Security-Policy' in html and "default-src 'none'" in html
                and 'mmh_n10a6_auth_owner_probe' in html
                and 'https://ldivswlhtgmznzwhzsoi.supabase.co' in html
                and 'https://vrypucmyrztxgiqhjspd.supabase.co' not in html
                and 'sb_secret_' not in html and 'SERVICE_ROLE_KEY' not in html)
              if ok:
                print('LIVE_GITHUB_PAGES_HTTPS HTTP',r.status,'PASS')
                print('TAB_ONLY_SESSION PASS')
                print('STAGING_PROJECT_ONLY PASS')
                print('QA_CSP_PRESENT PASS')
                break
              last='stale or wrong page'
            except Exception as exc: last=type(exc).__name__
            time.sleep(4)
          else:
            print('FAIL LIVE_PAGE',last)
            sys.exit(1)
          sdk='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js'
          try:
            r=urllib.request.urlopen(urllib.request.Request(sdk,headers={'User-Agent':'MMHVAULT-N10A76-QA'}),timeout=18)
            data=r.read(2048)
            valid=r.status==200 and len(data)>100
            print('PINNED_SUPABASE_JS_CDN', 'PASS' if valid else 'FAIL', 'HTTP',r.status)
            if not valid:sys.exit(1)
          except Exception as exc:
            print('PINNED_SUPABASE_JS_CDN FAIL',type(exc).__name__)
            sys.exit(1)
          print('N10A76_LIVE_PAGE PASS')
