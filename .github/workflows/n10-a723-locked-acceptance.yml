name: N10-A7.23 locked Staging username acceptance contract
on:
  push:
    branches: [n10-a7-3-staging-readonly-review]
    paths:
      - 'tests/N10-A7.23-locked-acceptance-smoke.test.cjs'
      - '.github/workflows/n10-a723-locked-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked implementation syntax
        run: |
          node --check integration/N10-A7.23-real-username-acceptance-LOCKED.cjs
          node --check tests/N10-A7.23-locked-acceptance-smoke.test.cjs
      - name: Synthetic-only identity, owner RLS and login/username binding tests
        run: node --test tests/N10-A7.23-locked-acceptance-smoke.test.cjs
      - name: Confirm real handler activation cannot occur in checked-in source
        run: |
          node -e "const s=require('node:fs').readFileSync('integration/N10-A7.23-real-username-acceptance-LOCKED.cjs','utf8');if(!s.includes('const ALLOW_REAL_OPERATIONS=false')||s.includes('supabase.createClient')||s.includes('fetch('))process.exit(1);console.log('STAGING_ACCEPTANCE_REVIEW_LOCKED PASS')"
