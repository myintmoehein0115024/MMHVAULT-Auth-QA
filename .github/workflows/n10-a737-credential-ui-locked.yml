name: N10-A7.37 isolated 3-login QA UI local HTTPS locked CI
on:
  push:
    branches: [n10-a7-3-staging-readonly-review]
    paths:
      - 'review/n10a737-credential-qa-LOCKED/**'
      - 'review/N10-A7.37-build-credential-ui-LOCKED.cjs'
      - 'tests/N10-A7.37-credential-qa-ui-LOCKED.test.cjs'
      - '.github/workflows/n10-a737-credential-ui-locked.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-triple-login-qa-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser without scripts
        working-directory: qa/n10-a728-real-sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce staging, real Auth and cloud gates hard-disabled
        run: |
          grep -q 'const ALLOW_REAL_OPERATIONS=false' integration/N10-A7.23-real-username-acceptance-LOCKED.cjs
          grep -q 'const STAGING_ADAPTER_ENABLED=false' integration/N10-A7.24-supabase-browser-adapter-REVIEW-LOCKED.cjs
          grep -q 'const STAGING_SDK_BOOTSTRAP_ENABLED=false' integration/N10-A7.27-staging-ephemeral-sdk-LOCKED.cjs
          grep -q 'const ALLOW_TURNSTILE_ACTIONS=false' integration/N10-A7.29-turnstile-actions-LOCKED.cjs
          grep -q 'const ALLOW_BROWSER_ACCEPTANCE=false' integration/N10-A7.30-browser-acceptance-LOCKED.cjs
          grep -q 'const ALLOW_ORIGIN_PATCH_DEPLOYMENT=false' review/N10-A7.36-build-browser-candidates-LOCKED.cjs
          grep -q 'const REAL_AUTH_ENABLED=false' review/n10a737-credential-qa-LOCKED/assets/auth-qa.js
          grep -q 'const REAL_REGISTRATION_ENABLED=false' review/n10a737-credential-qa-LOCKED/assets/auth-qa.js
          grep -q 'const REAL_RESET_ENABLED=false' review/n10a737-credential-qa-LOCKED/assets/auth-qa.js
          grep -q 'const GOOGLE_OAUTH_ENABLED=false' review/n10a737-credential-qa-LOCKED/assets/auth-qa.js
          node --check review/N10-A7.37-build-credential-ui-LOCKED.cjs
          node --check review/n10a737-credential-qa-LOCKED/assets/auth-qa.js
          node --check tests/N10-A7.37-credential-qa-ui-LOCKED.test.cjs
      - name: Build isolated static preview into QA artifact only
        run: node review/N10-A7.37-build-credential-ui-LOCKED.cjs
      - name: Test actual local HTTPS, real Chromium CSP, all flows and mobile
        run: node --test --test-concurrency=1 tests/N10-A7.37-credential-qa-ui-LOCKED.test.cjs
      - name: Save isolated never-deployed preview bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: N10-A7.37-TRIPLE-LOGIN-REGISTRATION-RESET-LOCKED-REVIEW
          path: qa/n10a737-preview-dist/
          retention-days: 7
          if-no-files-found: error
      - name: Confirm no deployment
        run: echo 'N10-A7.37 has no Cloudflare or Supabase deploy commands. G10/G11 still NOT RUN.'
