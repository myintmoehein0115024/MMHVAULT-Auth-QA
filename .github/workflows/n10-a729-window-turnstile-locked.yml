name: N10-A7.29 locked Turnstile and bounded UTC approval QA
on:
  push:
    branches: [n10-a7-3-staging-readonly-review]
    paths:
      - 'integration/N10-A7.29-turnstile-actions-LOCKED.cjs'
      - 'integration/N10-A7.29-window-approval-LOCKED.cjs'
      - 'tests/N10-A7.29-staging-window-and-turnstile.test.cjs'
      - '.github/workflows/n10-a729-window-turnstile-locked.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  window-and-widget-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm every existing and new security lock is committed as false
        run: |
          grep -q 'const ALLOW_REAL_OPERATIONS=false' integration/N10-A7.23-real-username-acceptance-LOCKED.cjs
          grep -q 'const STAGING_ADAPTER_ENABLED=false' integration/N10-A7.24-supabase-browser-adapter-REVIEW-LOCKED.cjs
          grep -q 'const STAGING_SDK_BOOTSTRAP_ENABLED=false' integration/N10-A7.27-staging-ephemeral-sdk-LOCKED.cjs
          grep -q 'const ALLOW_TURNSTILE_ACTIONS=false' integration/N10-A7.29-turnstile-actions-LOCKED.cjs
          grep -q 'const ALLOW_CLOUD_WINDOW_MUTATION=false' integration/N10-A7.29-window-approval-LOCKED.cjs
          node --check integration/N10-A7.29-turnstile-actions-LOCKED.cjs
          node --check integration/N10-A7.29-window-approval-LOCKED.cjs
          node --check tests/N10-A7.29-staging-window-and-turnstile.test.cjs
      - name: Run strictly offline CAPTCHA action and UTC approval negative regression
        run: node --test --test-concurrency=1 tests/N10-A7.29-staging-window-and-turnstile.test.cjs
