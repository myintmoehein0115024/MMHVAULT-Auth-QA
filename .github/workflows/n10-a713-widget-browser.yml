name: N10-A7.13 real Chromium Turnstile widget mounting
on:
  push:
    branches: [main]
    paths: ['.github/workflows/n10-a713-widget-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Open deployed Turnstile page in Chromium without completing a CAPTCHA
        run: |
          cat > .n10a713-widget.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const responses=[];
              page.on('response',r=>{if(r.url().includes('turnstile/v0/api.js'))responses.push({status:r.status(),url:r.url().split('?')[0]})});
              const r=await page.goto('https://myintmoehein0115024.github.io/MMHVAULT-Auth-QA/n10a713-turnstile-client-qa.html',{waitUntil:'domcontentloaded',timeout:30000});
              if(r.status()!==200)throw Error('page not HTTP 200');
              await page.waitForFunction(()=>typeof window.turnstile?.render==='function',{timeout:25000});
              await page.waitForTimeout(2500);
              const status=await page.evaluate(()=>({
                turnstileLoaded:typeof window.turnstile?.render==='function',
                widgetContainer:!!document.getElementById('turnstile'),
                widgetFrames:document.querySelectorAll('#turnstile iframe').length,
                hScroll:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                noTokensPersisted:!sessionStorage.length && !localStorage.length
              }));
              console.log('TURNSTILE_SCRIPT_RESPONSES',JSON.stringify(responses));
              console.log('TURNSTILE_UI_STATE',JSON.stringify(status));
              if(!status.turnstileLoaded||!status.widgetContainer||status.hScroll>1||!status.noTokensPersisted)throw Error('Widget runtime or mobile security test failed');
              console.log('N10A713_CHROMIUM_WIDGET_SCRIPT PASS (no human challenge completed)');
              await page.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error('N10A713_WIDGET_BROWSER_FAIL',String(e));process.exit(1)});
          JS
          node .n10a713-widget.cjs
