name: N10-A7.12 Staging Secrets added - fail-closed live readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/n10-a712-secret-presence-closed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: HTTPS preflight + login/bind remain closed (no passwords or tokens)
        shell: python
        run: |
          import urllib.request, urllib.error, json, sys
          url='https://ldivswlhtgmznzwhzsoi.supabase.co/functions/v1/mmh-n10a6-username'
          headers={'Origin':'https://myintmoehein0115024.github.io','Content-Type':'application/json'}
          cases=[('preflight',{'action':'preflight'},200,'preflight_ok'),
                 ('login',{'action':'login','username':'qa_dummy_user','password':'dummy-not-real'},503,'n10a6_disabled'),
                 ('bind',{'action':'bind','username':'qa_dummy_user','password':'dummy-not-real'},503,'n10a6_disabled')]
          passed=0
          for name,payload,want_status,want_code in cases:
            r=urllib.request.Request(url,method='POST',headers=headers,data=json.dumps(payload).encode())
            try:
              with urllib.request.urlopen(r,timeout=15) as resp: status=resp.status;data=resp.read(2048)
            except urllib.error.HTTPError as ex:
              status=ex.code;data=ex.read(2048)
            j=json.loads(data)
            good=(status==want_status and j.get('code')==want_code and 'access_token' not in j and 'refresh_token' not in j)
            if name=='preflight':
              good=good and j.get('enabled') is False and j.get('registration_enabled') is False and j.get('prerequisites_present') is True
              print('STAGING_TWO_SECRETS_PRESENT',j.get('prerequisites_present') is True,'(presence/length check only)')
            print('LIVE',name,'HTTP',status,j.get('code'),'PASS' if good else 'FAIL')
            passed+=int(good)
          print('N10A712_STAGE_READINESS_AND_CLOSED',passed,'/',len(cases))
          sys.exit(0 if passed==len(cases) else 1)
